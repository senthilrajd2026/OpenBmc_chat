[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embedai-validator"
version = "0.1.0"
description = "Extensible embedded hardware validation platform with AI-assisted diagnostics"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["embedded", "validation", "hardware", "testing", "linux"]
authors = [{ name = "EmbedAI Team" }]

dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
serial = ["pyserial>=3.5"]

[project.scripts]
embedai = "cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "core*", "board*", "plugins*", "ai*", "reports*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
