[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "openbmc-ft-poc"
version = "0.1.0"
description = "OpenBMC fine-tuning PoC: engineer-style debugging model"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.optional-dependencies]
train = [
    "torch>=2.1.0",
    "transformers>=4.39.0",
    "peft>=0.10.0",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.28.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
